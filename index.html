<!doctype html>
<html lang="es" data-theme="light" data-skin="styled">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Muévete. Respira. Vive el presente. HOY abre el 30 de octubre en Medellín." />
    <!-- 0155 · link previews (WhatsApp, Instagram, Facebook, X). %SITE_URL% is filled in at build time (vite.config.ts) because
         crawlers need absolute URLs; the card is rendered from W-11 by scripts/gen-og-image.mjs. The copy mirrors
         taglines.present and tenant.opensOn — update both together. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HOY · Human club" />
    <meta property="og:title" content="HOY · Abrimos el 30 de octubre en Medellín" />
    <meta property="og:description" content="Muévete. Respira. Vive el presente. Un espacio para moverte, conectar y hacer una pausa." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%brand/og-coming-soon.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="El estudio HOY con luz roja, espejos y colchonetas; Abrimos el 30 de octubre." />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1C2E42" />
    <link rel="icon" type="image/png" href="./brand/hoy-blue.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..600&display=swap" rel="stylesheet" />
    <!-- editorial serif for the website (V2 Sanctuary); a <link> degrades to the serif fallback stack, an @import in the chunk CSS did not -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
    <title>HoyOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
