name: Disconnected auth contract QA
on:
  pull_request:
    paths:
      - 'src/auth/clerkDevelopmentAdapter.ts'
      - 'scripts/test-clerk-development-adapter.mjs'
      - '.github/workflows/auth-contract-qa.yml'
permissions:
  contents: read
jobs:
  development-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-clerk-development-adapter.mjs
