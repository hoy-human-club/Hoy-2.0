name: Media Library QA
on:
  pull_request:
    paths:
      - 'src/data/media*'
      - 'src/modules/media/**'
      - 'src/modules/admin/MediaPage.tsx'
      - 'src/components/organism/MediaLibrary/**'
      - 'scripts/*media*'
      - '.github/workflows/media-library-qa.yml'
permissions:
  contents: read
jobs:
  media-library:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-media-model.mjs
      - name: Check media library
        run: |
          npm run dev -- --host 127.0.0.1 --port 5187 > /tmp/media-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5187/ >/dev/null && break; sleep 1; done
          node scripts/test-media-library.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          QA_BASE: http://127.0.0.1:5187
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-library-qa-${{ github.event.pull_request.head.sha }}
          retention-days: 3
          path: docs/screenshots/M-02d
