name: Subscription directory QA
on:
  pull_request:
    paths:
      - 'src/shared/subscriptions/**'
      - 'src/data/*[Ee]xpense*'
      - 'src/modules/admin/**'
      - 'src/modules/app-subscriptions/**'
      - 'scripts/test-subscription*'
      - 'scripts/test-service-catalog*'
      - 'public/brand/services/**'
      - '.github/workflows/subscriptions-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:subscriptions
      - run: npm run build
      - name: Check service catalog and manual receipts
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/subscriptions-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/test-service-catalog-ui.mjs
        env:
          QA_BASE: http://127.0.0.1:4173
          CHROMIUM_PATH: /usr/bin/google-chrome
          PROJECT: hoy
