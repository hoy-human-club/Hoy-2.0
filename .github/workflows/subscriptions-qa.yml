name: Subscription directory QA
on:
  pull_request:
    paths:
      - 'src/shared/subscriptions/**'
      - 'src/data/*[Ee]xpense*'
      - 'src/modules/admin/**'
      - 'src/modules/app-subscriptions/**'
      - 'scripts/test-subscription*'
      - '.github/workflows/subscriptions-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:subscriptions
      - run: npm run build
