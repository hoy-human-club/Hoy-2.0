name: Frontend correctness QA
on:
  pull_request:
    paths:
      - 'src/modules/customer/**'
      - 'src/modules/admin/**'
      - 'src/modules/dev/**'
      - 'src/modules/transfers/**'
      - 'src/modules/desk/**'
      - 'src/modules/teacher/**'
      - 'src/modules/staff/maskPhone.ts'
      - 'src/modules/staff/people.ts'
      - 'src/data/**'
      - 'src/i18n/**'
      - 'src/tenant/**'
      - 'scripts/test-api-key-mutations*.mjs'
      - 'scripts/test-trial-eligibility*.mjs'
      - 'scripts/trial-eligibility-harness.tsx'
      - 'scripts/test-profile-save*.mjs'
      - 'scripts/profile-save-harness.tsx'
      - 'scripts/test-recovery*.mjs'
      - 'scripts/test-account-data*.mjs'
      - 'scripts/account-data-harness.tsx'
      - 'scripts/test-contact-mask*.mjs'
      - 'scripts/test-substitute-request*.mjs'
      - 'scripts/substitute-request-harness.tsx'
      - 'scripts/test-notification-prefs*.mjs'
      - 'scripts/test-account-marketing*.mjs'
      - 'scripts/test-email-test*.mjs'
      - 'scripts/email-test-harness.tsx'
      - 'scripts/test-payroll-draft*.mjs'
      - 'scripts/fixtures/payroll-draft-before.ts'
      - 'scripts/test-event-rsvp*.mjs'
      - 'scripts/event-rsvp-harness.tsx'
      - 'scripts/test-email-edit*.mjs'
      - 'scripts/email-edit-harness.tsx'
      - 'scripts/test-expense-ledger*.mjs'
      - 'scripts/expense-ledger-harness.tsx'
      - 'scripts/test-receipt-alert*.mjs'
      - 'scripts/receipt-alert-harness.tsx'
      - 'scripts/test-payroll-approval*.mjs'
      - 'scripts/payroll-approval-harness.tsx'
      - 'scripts/fixtures/**'
      - 'src/components/organism/ReceiptAlertResult/**'
      - 'src/components/organism/ExpenseLedgerStatus/**'
      - '.github/workflows/frontend-correctness-qa.yml'
permissions:
  contents: read
jobs:
  mock-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [api-key-mutations, trial-eligibility, profile-save, recovery, account-data, contact-mask, substitute-request, notification-prefs, account-marketing, email-test, payroll-draft, event-rsvp, email-edit, expense-ledger, receipt-alert, payroll-approval]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify fictional command invariants
        run: |
          if [ '${{ matrix.scope }}' = 'receipt-alert' ]; then
            node scripts/test-receipt-alert-intent.mjs
          else
            node scripts/test-${{ matrix.scope }}.mjs
          fi
      - name: Verify required-row replay fences
        if: matrix.scope == 'account-data'
        run: node scripts/test-account-data-replay.mjs
      - name: Verify public preference acknowledgement lifecycle
        if: matrix.scope == 'notification-prefs'
        run: node scripts/test-notification-prefs-hook.mjs
      - name: Verify payroll acknowledgement lifecycle
        if: matrix.scope == 'payroll-draft'
        run: node scripts/test-payroll-draft-hook.mjs
      - name: Verify added command acknowledgement lifecycle
        if: matrix.scope == 'email-edit' || matrix.scope == 'payroll-approval'
        run: node scripts/test-${{ matrix.scope }}-hook.mjs
      - name: Verify rendered production behavior
        run: |
          npm run preview -- --host 127.0.0.1 --port 5187 > /tmp/hoy-correctness-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5187/ >/dev/null && break; sleep 1; done
          node scripts/test-${{ matrix.scope }}-ui.mjs
        env:
          QA_BASE: http://127.0.0.1:5187
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Verify shared receipt alert library inventory
        if: matrix.scope == 'receipt-alert'
        run: node scripts/test-receipt-alert-library.mjs
        env:
          QA_BASE: http://127.0.0.1:5187
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Verify contained asynchronous states
        if: matrix.scope == 'trial-eligibility' || matrix.scope == 'profile-save' || matrix.scope == 'account-data' || matrix.scope == 'substitute-request' || matrix.scope == 'account-marketing' || matrix.scope == 'email-test' || matrix.scope == 'event-rsvp' || matrix.scope == 'email-edit' || matrix.scope == 'expense-ledger' || matrix.scope == 'receipt-alert' || matrix.scope == 'payroll-approval'
        run: |
          npm run dev -- --host 127.0.0.1 --port 5188 > /tmp/hoy-correctness-dev.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5188/ >/dev/null && break; sleep 1; done
          node scripts/test-${{ matrix.scope }}-states.mjs
        env:
          QA_BASE: http://127.0.0.1:5188
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-${{ matrix.scope }}-${{ github.event.pull_request.head.sha }}
          path: |
            docs/frontend-completion/evidence/batch-2*.json
            docs/screenshots/C-19/*profile*
            docs/screenshots/C-21/*recovery*
            docs/screenshots/D-07/*key-atomic*
            docs/screenshots/S-09/*trial*
            docs/screenshots/C-26/*account*
            docs/screenshots/M-06/*contact-mask*
            docs/screenshots/S-04/*contact-mask*
            docs/screenshots/S-03/*substitute*
            docs/screenshots/C-24/*prefs*
            docs/screenshots/C-26/*marketing*
            docs/screenshots/M-04/*email-test*
            docs/screenshots/M-09a/*draft*
            docs/screenshots/M-09b/*draft*
            docs/screenshots/C-23/*rsvp*
            docs/screenshots/M-04/*email-edit*
            docs/screenshots/M-09c/*expense*
            docs/screenshots/M-09b/*approval*
            docs/screenshots/C-04/*receipt-alert*
            docs/screenshots/D-02/*receipt-alert*
            docs/frontend-completion/evidence/batch-3*.json
          retention-days: 7
