name: Future frontend mock QA
on:
  pull_request:
    paths:
      - 'src/modules/maintenance/**'
      - 'src/modules/marketing/**'
      - 'src/components/organism/MarketingDraftBoard/**'
      - 'scripts/test-marketing-draft*.mjs'
      - 'scripts/marketing-draft-fences-harness.tsx'
      - 'src/components/organism/MaintenanceWorkbench/**'
      - 'src/modules/admin/GoogleBusinessPage.tsx'
      - 'src/modules/admin/googleBusinessDryRun.ts'
      - 'src/modules/admin/strings.ts'
      - 'src/data/schema.ts'
      - 'src/data/MockProvider.ts'
      - 'scripts/test-maintenance*.mjs'
      - 'scripts/test-google-business*.mjs'
      - '.github/workflows/future-frontend-qa.yml'
permissions:
  contents: read
jobs:
  google-hours:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-google-business-dry-run.mjs
      - run: npm run test:hours
      - name: Verify disconnected hours simulation
        run: |
          npm run preview -- --host 127.0.0.1 --port 5187 > /tmp/hoy-hours-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5187/ >/dev/null && break; sleep 1; done
          node scripts/test-google-business-ui.mjs
        env:
          QA_BASE: http://127.0.0.1:5187
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-hours-${{ github.event.pull_request.head.sha }}
          path: docs/screenshots/M-10a/*dry-run*
          retention-days: 7
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-maintenance.mjs
      - run: node scripts/test-maintenance-fences.mjs
      - run: node scripts/test-mock-additive-upgrade.mjs
      - run: node scripts/test-draft-receipt-schema.mjs
      - name: Verify fictional maintenance workspace
        run: |
          npm run preview -- --host 127.0.0.1 --port 5187 > /tmp/hoy-maintenance-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5187/ >/dev/null && break; sleep 1; done
          node scripts/test-maintenance-ui.mjs
          node scripts/test-maintenance-create-ui.mjs
          node scripts/test-maintenance-fences-ui.mjs
        env:
          QA_BASE: http://127.0.0.1:5187
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Verify asynchronous maintenance read states
        run: |
          npm run dev -- --host 127.0.0.1 --port 5188 > /tmp/hoy-maintenance-dev.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5188/ >/dev/null && break; sleep 1; done
          node scripts/test-maintenance-states.mjs
          node scripts/test-maintenance-fences-states.mjs
        env:
          QA_BASE: http://127.0.0.1:5188
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-${{ github.event.pull_request.head.sha }}
          path: docs/screenshots/S-10
          retention-days: 7
  marketing-fences:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-marketing-drafts.mjs
      - run: node scripts/test-marketing-draft-fences.mjs
      - name: Verify local draft production and inventory
        run: |
          npm run preview -- --host 127.0.0.1 --strictPort --port 5187 > /tmp/hoy-marketing-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5187/ >/dev/null && break; sleep 1; done
          node scripts/test-marketing-drafts-ui.mjs
          node scripts/test-marketing-draft-library-ui.mjs
        env:
          QA_BASE: http://127.0.0.1:5187
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Verify contained local draft asynchronous states
        run: |
          npm run dev -- --host 127.0.0.1 --strictPort --port 5188 > /tmp/hoy-marketing-dev.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5188/ >/dev/null && break; sleep 1; done
          node scripts/test-marketing-draft-fences-states.mjs
        env:
          QA_BASE: http://127.0.0.1:5188
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-fences-${{ github.event.pull_request.head.sha }}
          path: |
            docs/screenshots/M-18/*fences*
            docs/screenshots/M-18/*library*
          retention-days: 7
